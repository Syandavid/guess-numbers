<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="猜数字">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="看一眼数字，然后说出来。">
  <title>猜数字</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    :root {
      --bg: #000;
      --text: #fff;
      --orange: #FF7A00;
      --muted: rgba(255, 255, 255, 0.55);
      --app-h: 100dvh;
      --stage-max: 480px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      width: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Helvetica Neue", sans-serif;
      touch-action: manipulation;
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: stretch;
    }

    #app {
      position: relative;
      width: 100%;
      max-width: none;
      height: var(--app-h);
      overflow: hidden;
      background: #000;
      container-type: inline-size;
      container-name: stage;
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
    }

    @media (orientation: landscape) and (max-height: 560px) {
      .title {
        font-size: clamp(32px, 14vh, 56px);
      }
      #home {
        padding-top: calc(env(safe-area-inset-top, 0px) + 8px);
        padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
        padding-left: calc(env(safe-area-inset-left, 0px) + 24px);
        padding-right: calc(env(safe-area-inset-right, 0px) + 24px);
      }
      .stage {
        padding: 0 16px 72px;
      }
      .home-actions {
        flex-direction: row;
        width: min(100%, 520px);
      }
      .start-btn, .ghost-btn { font-size: 20px; padding: 12px 20px; }
    }

    @media (hover: hover) and (pointer: fine) and (min-width: 960px) and (min-height: 700px) {
      html, body {
        background: #161616;
        align-items: center;
      }
      #app {
        max-width: var(--stage-max);
        height: min(var(--app-h), calc(100dvh - 32px));
        max-height: calc(100dvh - 32px);
        border-radius: 24px;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.08),
          0 24px 64px rgba(0, 0, 0, 0.5);
        padding-left: 0;
        padding-right: 0;
      }
    }

    .screen {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
    }
    .screen.active { display: flex; }

    #home {
      padding: calc(env(safe-area-inset-top, 0px) + 24px) 32px calc(env(safe-area-inset-bottom, 0px) + 40px);
      justify-content: space-between;
      align-items: center;
    }

    .home-spacer { flex: 1; }

    .title {
      font-size: clamp(56px, 18vw, 92px);
      font-size: clamp(56px, 18cqi, 92px);
      font-weight: 700;
      letter-spacing: 0.06em;
      line-height: 1.1;
      text-align: center;
    }

    .home-hint {
      margin-top: 16px;
      color: var(--muted);
      font-size: 15px;
      letter-spacing: 0.06em;
      text-align: center;
    }

    .home-actions {
      width: min(100%, 320px);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .start-btn, .ghost-btn {
      appearance: none;
      border: none;
      width: 100%;
      padding: 18px 28px;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 0.12em;
      border-radius: 18px;
      cursor: pointer;
      font-family: inherit;
    }
    .start-btn { background: #fff; color: #000; }
    .ghost-btn {
      background: transparent;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.28);
      font-size: 20px;
      padding: 14px 28px;
    }
    .start-btn:active, .ghost-btn:active { transform: scale(0.98); opacity: 0.92; }

    #game { cursor: pointer; }

    .exit-btn {
      position: absolute;
      top: calc(env(safe-area-inset-top, 0px) + 8px);
      left: calc(env(safe-area-inset-left, 0px) + 12px);
      z-index: 2;
      appearance: none;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 16px;
      font-weight: 500;
      padding: 12px 14px;
      font-family: inherit;
      cursor: pointer;
      letter-spacing: 0.04em;
    }
    .exit-btn:active { opacity: 0.7; }

    .stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px 88px;
      pointer-events: none;
    }

    .phase-text {
      font-size: clamp(64px, 20vw, 104px);
      font-size: clamp(64px, 20cqi, 104px);
      font-weight: 700;
      letter-spacing: 0.12em;
      line-height: 1;
      text-align: center;
    }
    .phase-text.ready { color: var(--orange); }
    .phase-text.speak { color: #fff; }

    .numbers {
      display: block;
      max-width: 100%;
      color: #fff;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum";
      font-weight: 700;
      font-size: clamp(64px, 20vw, 104px);
      font-size: clamp(64px, 20cqi, 104px);
      letter-spacing: 0.04em;
      line-height: 1.08;
      text-align: center;
      white-space: normal;
      word-break: break-all;
      overflow-wrap: anywhere;
    }
    .numbers.answer { color: #22C55E; }

    .session-scores {
      position: absolute;
      top: calc(env(safe-area-inset-top, 0px) + 14px);
      right: calc(env(safe-area-inset-right, 0px) + 16px);
      z-index: 2;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.18em;
      pointer-events: none;
    }

    #game.answering .stage { padding-bottom: 220px; }

    .answer-bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 0 20px;
    }

    .judge-row {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 320px;
    }
    .judge-btn {
      flex: 1;
      appearance: none;
      border: 1px solid rgba(255,255,255,0.28);
      background: rgba(0,0,0,0.5);
      color: #fff;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 0.16em;
      border-radius: 16px;
      padding: 16px 20px;
      font-family: inherit;
      cursor: pointer;
    }
    .judge-btn:active { opacity: 0.85; transform: scale(0.98); }

    .group-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      width: 100%;
      max-width: 280px;
    }
    .group-chip {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      appearance: none;
      border: 2px solid rgba(255,255,255,0.35);
      background: transparent;
      color: #fff;
      font-size: 22px;
      font-weight: 700;
      font-family: inherit;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
    }
    .group-chip.active {
      background: #22C55E;
      border-color: #22C55E;
      color: #000;
    }
    .group-chip:active { transform: scale(0.96); }

    .action-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .replay-btn {
      appearance: none;
      border: 1px solid rgba(255,255,255,0.28);
      background: rgba(0,0,0,0.5);
      color: #fff;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.12em;
      border-radius: 16px;
      padding: 14px 36px;
      font-family: inherit;
      cursor: pointer;
    }
    .replay-btn:active { opacity: 0.85; }

    #settings {
      padding: calc(env(safe-area-inset-top, 0px) + 56px) 24px calc(env(safe-area-inset-bottom, 0px) + 32px);
      gap: 28px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .settings-title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 0 8px;
    }

    .setting {
      padding: 0 8px;
    }
    .setting-label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 12px;
      font-size: 16px;
      color: var(--muted);
      letter-spacing: 0.06em;
    }
    .setting-value {
      color: #fff;
      font-variant-numeric: tabular-nums;
      font-size: 18px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--orange);
      height: 28px;
    }

    .chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .chip {
      appearance: none;
      border: 1px solid rgba(255,255,255,0.22);
      background: transparent;
      color: #fff;
      border-radius: 999px;
      padding: 10px 16px;
      font-size: 16px;
      font-family: inherit;
      cursor: pointer;
      letter-spacing: 0.04em;
    }
    .chip.active {
      background: var(--orange);
      border-color: var(--orange);
      color: #000;
      font-weight: 600;
    }

    .hidden { display: none !important; }

    .start-btn:focus-visible,
    .ghost-btn:focus-visible,
    .exit-btn:focus-visible,
    .replay-btn:focus-visible,
    .judge-btn:focus-visible,
    .group-chip:focus-visible,
    .chip:focus-visible,
    input[type="range"]:focus-visible {
      outline: 2px solid var(--orange);
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <div id="app">
    <section id="home" class="screen active" aria-label="首页">
      <div class="home-spacer"></div>
      <h1 class="title">猜数字</h1>
      <p class="home-hint" id="homeHint"></p>
      <div class="home-spacer"></div>
      <div class="home-actions">
        <button type="button" class="start-btn" id="startBtn">开始</button>
        <button type="button" class="ghost-btn" id="settingsBtn">难度设置</button>
      </div>
    </section>

    <section id="settings" class="screen" aria-label="难度设置">
      <button type="button" class="exit-btn" id="settingsBack">返回</button>
      <h2 class="settings-title">难度</h2>
      <div class="setting">
        <div class="setting-label">
          <span>闪现时长</span>
          <span class="setting-value" id="flashLabel">0.40 秒</span>
        </div>
        <input type="range" id="flashRange" min="50" max="1000" step="25" value="400">
        <div class="chips" id="flashPresets" style="margin-top:12px">
          <button type="button" class="chip" data-ms="50">极快</button>
          <button type="button" class="chip" data-ms="100">很快</button>
          <button type="button" class="chip" data-ms="200">快</button>
          <button type="button" class="chip" data-ms="400">普通</button>
          <button type="button" class="chip" data-ms="800">慢</button>
        </div>
      </div>
      <div class="setting">
        <div class="setting-label">
          <span>数字位数</span>
          <span class="setting-value" id="digitLabel">5 位</span>
        </div>
        <input type="range" id="digitRange" min="1" max="15" step="1" value="5">
        <div class="chips" id="digitChips" style="margin-top:12px">
          <button type="button" class="chip" data-digits="4">4</button>
          <button type="button" class="chip" data-digits="5">5</button>
          <button type="button" class="chip" data-digits="8">8</button>
          <button type="button" class="chip" data-digits="10">10</button>
          <button type="button" class="chip" data-digits="12">12</button>
          <button type="button" class="chip" data-digits="15">15</button>
          <button type="button" class="chip" data-digits="mix">随机</button>
        </div>
      </div>
      <div class="setting" id="mixSetting">
        <div class="setting-label">
          <span>随机最少</span>
          <span class="setting-value" id="mixMinLabel">4 位</span>
        </div>
        <input type="range" id="mixMinRange" min="1" max="15" step="1" value="4">
        <div class="setting-label" style="margin-top:16px">
          <span>随机最多</span>
          <span class="setting-value" id="mixMaxLabel">10 位</span>
        </div>
        <input type="range" id="mixMaxRange" min="1" max="15" step="1" value="10">
      </div>
      <div class="setting">
        <div class="setting-label">
          <span>人数</span>
          <span class="setting-value" id="playerLabel">单人</span>
        </div>
        <div class="chips" id="playerChips">
          <button type="button" class="chip" data-players="1">单人</button>
          <button type="button" class="chip" data-players="2">2</button>
          <button type="button" class="chip" data-players="3">3</button>
          <button type="button" class="chip" data-players="4">4</button>
          <button type="button" class="chip" data-players="5">5</button>
          <button type="button" class="chip" data-players="6">6</button>
          <button type="button" class="chip" data-players="7">7</button>
        </div>
      </div>
      <div class="setting">
        <div class="setting-label">
          <span>数字大小</span>
          <span class="setting-value" id="sizeLabel">100%</span>
        </div>
        <input type="range" id="sizeRange" min="50" max="100" step="5" value="100">
        <div class="chips" id="sizePresets" style="margin-top:12px">
          <button type="button" class="chip" data-size="60">小</button>
          <button type="button" class="chip" data-size="80">中</button>
          <button type="button" class="chip" data-size="100">最大</button>
        </div>
      </div>
    </section>

    <section id="game" class="screen" aria-label="游戏">
      <button type="button" class="exit-btn" id="exitBtn">退出</button>
      <div id="sessionScores" class="session-scores hidden" aria-hidden="true"></div>
      <div class="stage">
        <div id="readyText" class="phase-text ready hidden">准备</div>
        <div id="flashText" class="numbers hidden"></div>
        <div id="speakText" class="phase-text speak hidden">请说</div>
      </div>
      <div id="answerBar" class="answer-bar hidden">
        <div id="soloRow" class="judge-row hidden">
          <button type="button" class="judge-btn" id="yesBtn">对</button>
          <button type="button" class="judge-btn" id="noBtn">错</button>
        </div>
        <div id="groupRow" class="group-row hidden"></div>
        <div class="action-row">
          <button type="button" class="replay-btn" id="replayBtn">重玩</button>
          <button type="button" class="replay-btn" id="nextBtn">下一轮</button>
        </div>
      </div>
    </section>
  </div>

  <script>
    (function () {
      const home = document.getElementById("home");
      const game = document.getElementById("game");
      const settings = document.getElementById("settings");
      const startBtn = document.getElementById("startBtn");
      const settingsBtn = document.getElementById("settingsBtn");
      const settingsBack = document.getElementById("settingsBack");
      const exitBtn = document.getElementById("exitBtn");
      const readyText = document.getElementById("readyText");
      const flashText = document.getElementById("flashText");
      const speakText = document.getElementById("speakText");
      const replayBtn = document.getElementById("replayBtn");
      const nextBtn = document.getElementById("nextBtn");
      const yesBtn = document.getElementById("yesBtn");
      const noBtn = document.getElementById("noBtn");
      const answerBar = document.getElementById("answerBar");
      const soloRow = document.getElementById("soloRow");
      const groupRow = document.getElementById("groupRow");
      const sessionScoresEl = document.getElementById("sessionScores");
      const playerLabel = document.getElementById("playerLabel");
      const app = document.getElementById("app");
      const flashRange = document.getElementById("flashRange");
      const digitRange = document.getElementById("digitRange");
      const digitLabel = document.getElementById("digitLabel");
      const mixSetting = document.getElementById("mixSetting");
      const mixMinRange = document.getElementById("mixMinRange");
      const mixMaxRange = document.getElementById("mixMaxRange");
      const mixMinLabel = document.getElementById("mixMinLabel");
      const mixMaxLabel = document.getElementById("mixMaxLabel");
      const flashLabel = document.getElementById("flashLabel");
      const homeHint = document.getElementById("homeHint");
      const sizeRange = document.getElementById("sizeRange");
      const sizeLabel = document.getElementById("sizeLabel");
      const stageEl = document.querySelector("#game .stage");

      const STORE = "guess-numbers-settings";
      const STATS_KEY = "guess-numbers-stats";

      let settingsState = loadSettings();
      let stats = loadStats();
      let phase = "home";
      let readyTimer = null;
      let flashTimer = null;
      let lastNumber = "";
      let sessionScores = [0, 0, 0, 0, 0, 0, 0];
      let groupSelected = [];

      function loadSettings() {
        try {
          const raw = localStorage.getItem(STORE);
          if (raw) {
            const parsed = JSON.parse(raw);
            const flashMs = clampMs(parsed.flashMs);
            const digits = normalizeDigits(parsed.digits);
            const mix = normalizeMix(parsed.mixMin, parsed.mixMax);
            return {
              flashMs: flashMs,
              digits: digits,
              mixMin: mix.min,
              mixMax: mix.max,
              sizePct: clampSize(parsed.sizePct),
              playerCount: clampPlayers(parsed.playerCount)
            };
          }
        } catch (_) {}
        return { flashMs: 400, digits: 5, mixMin: 4, mixMax: 10, sizePct: 100, playerCount: 1 };
      }

      function clampMs(n) {
        n = Number(n);
        if (!Number.isFinite(n)) return 400;
        return Math.min(1000, Math.max(50, Math.round(n / 25) * 25));
      }

      function clampSize(n) {
        n = Number(n);
        if (!Number.isFinite(n)) return 100;
        return Math.min(100, Math.max(50, Math.round(n / 5) * 5));
      }

      function clampPlayers(n) {
        n = Number(n);
        if (!Number.isFinite(n)) return 1;
        return Math.min(7, Math.max(1, Math.round(n)));
      }

      function clampDigit(n, fallback) {
        n = Number(n);
        if (!Number.isInteger(n)) return fallback;
        return Math.min(15, Math.max(1, n));
      }

      function normalizeDigits(d) {
        if (d === "mix") return "mix";
        return clampDigit(d, 5);
      }

      function normalizeMix(minV, maxV) {
        let min = clampDigit(minV, 4);
        let max = clampDigit(maxV, 10);
        if (min > max) {
          const t = min;
          min = max;
          max = t;
        }
        return { min: min, max: max };
      }

      function saveSettings() {
        try {
          localStorage.setItem(STORE, JSON.stringify(settingsState));
        } catch (_) {}
        renderSettings();
      }

      function todayStr() {
        const d = new Date();
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        return y + "-" + m + "-" + day;
      }

      function emptyGroups() {
        return [0, 0, 0, 0, 0, 0, 0];
      }

      function normalizeGroups(g) {
        const out = emptyGroups();
        if (!Array.isArray(g)) return out;
        for (let i = 0; i < 7; i++) {
          const n = Number(g[i]);
          out[i] = Number.isFinite(n) && n > 0 ? Math.floor(n) : 0;
        }
        return out;
      }

      function loadStats() {
        const today = todayStr();
        let maxDigits = 0;
        let rolled = true;
        let parsed = null;
        try {
          const raw = localStorage.getItem(STATS_KEY);
          if (raw) parsed = JSON.parse(raw);
        } catch (_) {
          parsed = null;
        }
        if (parsed && typeof parsed === "object") {
          const md = Number(parsed.maxDigits);
          if (Number.isFinite(md) && md > 0) maxDigits = Math.floor(md);
          if (parsed.date === today) {
            rolled = false;
            return {
              date: today,
              rounds: Math.max(0, Math.floor(Number(parsed.rounds) || 0)),
              correct: Math.max(0, Math.floor(Number(parsed.correct) || 0)),
              streak: Math.max(0, Math.floor(Number(parsed.streak) || 0)),
              maxDigits: maxDigits,
              groups: normalizeGroups(parsed.groups)
            };
          }
        }
        const fresh = {
          date: today,
          rounds: 0,
          correct: 0,
          streak: 0,
          maxDigits: maxDigits,
          groups: emptyGroups()
        };
        if (rolled) saveStatsObject(fresh);
        return fresh;
      }

      function saveStatsObject(obj) {
        try {
          localStorage.setItem(STATS_KEY, JSON.stringify(obj));
        } catch (_) {}
      }

      function saveStats() {
        saveStatsObject(stats);
        renderHomeHint();
      }

      function bumpMaxDigits() {
        const len = (lastNumber || "").length;
        if (len > stats.maxDigits) stats.maxDigits = len;
      }

      function digitsLabel() {
        if (settingsState.digits === "mix") {
          return "随机 " + settingsState.mixMin + "–" + settingsState.mixMax + " 位";
        }
        return settingsState.digits + " 位";
      }

      function playerCountLabel() {
        return settingsState.playerCount === 1 ? "单人" : settingsState.playerCount + " 人";
      }

      function renderHomeHint() {
        homeHint.textContent =
          "今日 " + stats.rounds + " 次 · 连对 " + stats.streak + " · 最长 " + stats.maxDigits + " 位";
      }

      function renderSettings() {
        flashRange.value = String(settingsState.flashMs);
        flashLabel.textContent = (settingsState.flashMs / 1000).toFixed(2) + " 秒";
        const isMix = settingsState.digits === "mix";
        mixSetting.classList.toggle("hidden", !isMix);
        digitRange.classList.toggle("hidden", isMix);
        if (!isMix) digitRange.value = String(settingsState.digits);
        mixMinRange.value = String(settingsState.mixMin);
        mixMaxRange.value = String(settingsState.mixMax);
        mixMinLabel.textContent = settingsState.mixMin + " 位";
        mixMaxLabel.textContent = settingsState.mixMax + " 位";
        digitLabel.textContent = digitsLabel();
        sizeRange.value = String(settingsState.sizePct);
        sizeLabel.textContent = settingsState.sizePct + "%";
        playerLabel.textContent = playerCountLabel();
        renderHomeHint();
        document.querySelectorAll("#sizePresets .chip").forEach((btn) => {
          btn.classList.toggle("active", Number(btn.dataset.size) === settingsState.sizePct);
        });
        document.querySelectorAll("#flashPresets .chip").forEach((btn) => {
          btn.classList.toggle("active", Number(btn.dataset.ms) === settingsState.flashMs);
        });
        document.querySelectorAll("#digitChips .chip").forEach((btn) => {
          const val = btn.dataset.digits === "mix" ? "mix" : Number(btn.dataset.digits);
          btn.classList.toggle("active", val === settingsState.digits);
        });
        document.querySelectorAll("#playerChips .chip").forEach((btn) => {
          btn.classList.toggle("active", Number(btn.dataset.players) === settingsState.playerCount);
        });
      }

      function showScreen(el) {
        home.classList.remove("active");
        game.classList.remove("active");
        settings.classList.remove("active");
        el.classList.add("active");
      }

      function setAppHeight() {
        const vv = window.visualViewport;
        const h = vv ? vv.height : window.innerHeight;
        const w = vv ? vv.width : window.innerWidth;
        document.documentElement.style.setProperty("--app-h", h + "px");
        if (vv) {
          app.style.transform = "translate(" + vv.offsetLeft + "px," + vv.offsetTop + "px)";
          app.style.width = w + "px";
        } else {
          app.style.width = "";
          app.style.transform = "";
        }
      }

      function relayoutGame() {
        setAppHeight();
        if (phase === "flash" || phase === "answer" || phase === "ready" || phase === "speak") {
          requestAnimationFrame(applyNumberSize);
        }
      }

      setAppHeight();
      window.addEventListener("resize", relayoutGame);
      window.addEventListener("orientationchange", () => {
        relayoutGame();
        setTimeout(relayoutGame, 250);
        setTimeout(relayoutGame, 600);
      });
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", relayoutGame);
        window.visualViewport.addEventListener("scroll", setAppHeight);
      }

      document.addEventListener("gesturestart", (e) => e.preventDefault());
      document.addEventListener("dblclick", (e) => e.preventDefault());
      document.addEventListener(
        "touchmove",
        (e) => {
          if (e.touches.length > 1) e.preventDefault();
        },
        { passive: false }
      );

      function clearTimers() {
        if (readyTimer !== null) {
          clearTimeout(readyTimer);
          readyTimer = null;
        }
        if (flashTimer !== null) {
          clearTimeout(flashTimer);
          flashTimer = null;
        }
      }

      function vibrate() {
        try {
          if (navigator.vibrate) navigator.vibrate(12);
        } catch (_) {}
      }

      function showOnly(el) {
        readyText.classList.add("hidden");
        flashText.classList.add("hidden");
        speakText.classList.add("hidden");
        el.classList.remove("hidden");
      }

      function randomNumber() {
        let digits = settingsState.digits;
        if (digits === "mix") {
          const span = settingsState.mixMax - settingsState.mixMin + 1;
          digits = settingsState.mixMin + Math.floor(Math.random() * span);
        }
        if (digits <= 1) return String(Math.floor(Math.random() * 10));
        let s = String(1 + Math.floor(Math.random() * 9));
        for (let i = 1; i < digits; i++) s += String(Math.floor(Math.random() * 10));
        return s;
      }

      function stopBubble(e) {
        e.stopPropagation();
      }

      function bindStop(el) {
        el.addEventListener("pointerdown", stopBubble);
        el.addEventListener("pointerup", stopBubble);
        el.addEventListener("click", stopBubble);
      }

      function renderSessionScores() {
        const n = settingsState.playerCount;
        if (n < 2 || (phase !== "ready" && phase !== "flash" && phase !== "speak" && phase !== "answer")) {
          sessionScoresEl.classList.add("hidden");
          return;
        }
        sessionScoresEl.textContent = sessionScores.slice(0, n).join("  ");
        sessionScoresEl.classList.remove("hidden");
      }

      function setAnswerControls(on) {
        game.classList.toggle("answering", on);
        answerBar.classList.toggle("hidden", !on);
        if (!on) {
          soloRow.classList.add("hidden");
          groupRow.classList.add("hidden");
          nextBtn.classList.add("hidden");
          return;
        }
        const multi = settingsState.playerCount >= 2;
        soloRow.classList.toggle("hidden", multi);
        groupRow.classList.toggle("hidden", !multi);
        nextBtn.classList.toggle("hidden", !multi);
        if (multi) rebuildGroups();
      }

      function rebuildGroups() {
        const n = settingsState.playerCount;
        groupSelected = [];
        groupRow.innerHTML = "";
        for (let i = 0; i < n; i++) {
          groupSelected.push(false);
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "group-chip";
          btn.textContent = String(i + 1);
          btn.dataset.group = String(i);
          btn.setAttribute("aria-label", "组 " + (i + 1));
          btn.setAttribute("aria-pressed", "false");
          groupRow.appendChild(btn);
        }
      }

      function toggleGroup(i) {
        if (phase !== "answer") return;
        if (i < 0 || i >= settingsState.playerCount) return;
        groupSelected[i] = !groupSelected[i];
        const btn = groupRow.querySelector('[data-group="' + i + '"]');
        if (btn) {
          btn.classList.toggle("active", groupSelected[i]);
          btn.setAttribute("aria-pressed", groupSelected[i] ? "true" : "false");
        }
      }

      function applyNumberSize() {
        const text = lastNumber || flashText.textContent || "0";
        const n = Math.max(1, text.length);
        const width = Math.max(80, (stageEl ? stageEl.clientWidth : window.innerWidth) - 16);
        const height = Math.max(80, (stageEl ? stageEl.clientHeight : window.innerHeight) * 0.82);
        const glyph = 0.58;
        const ls = 0.03;
        const lh = 1.06;
        let lo = 24;
        let hi = Math.min(width, height, 280);
        let best = 24;
        while (hi - lo > 0.5) {
          const fs = (lo + hi) / 2;
          const colW = fs * (glyph + ls);
          const cols = Math.max(1, Math.floor(width / colW));
          const rows = Math.ceil(n / cols);
          if (rows * fs * lh <= height) {
            best = fs;
            lo = fs;
          } else {
            hi = fs;
          }
        }
        best *= settingsState.sizePct / 100;
        flashText.style.fontSize = best + "px";
        flashText.style.letterSpacing = best * ls + "px";
      }

      function enterReady(keep) {
        clearTimers();
        setAnswerControls(false);
        phase = "ready";
        showOnly(readyText);
        renderSessionScores();
        vibrate();
        readyTimer = setTimeout(() => {
          readyTimer = null;
          enterFlash(keep);
        }, 1500);
      }

      function enterFlash(keep) {
        phase = "flash";
        setAnswerControls(false);
        if (!keep) lastNumber = randomNumber();
        flashText.classList.remove("answer");
        flashText.textContent = lastNumber;
        showOnly(flashText);
        applyNumberSize();
        renderSessionScores();
        vibrate();
        flashTimer = setTimeout(() => {
          flashTimer = null;
          enterSpeak();
        }, settingsState.flashMs);
      }

      function enterSpeak() {
        phase = "speak";
        setAnswerControls(false);
        showOnly(speakText);
        renderSessionScores();
        vibrate();
      }

      function enterAnswer() {
        phase = "answer";
        flashText.classList.add("answer");
        flashText.textContent = lastNumber;
        showOnly(flashText);
        applyNumberSize();
        setAnswerControls(true);
        renderSessionScores();
        vibrate();
      }

      function recordSolo(ok) {
        if (phase !== "answer") return;
        stats.rounds += 1;
        if (ok) {
          stats.correct += 1;
          stats.streak += 1;
        } else {
          stats.streak = 0;
        }
        bumpMaxDigits();
        saveStats();
        enterReady(false);
      }

      function commitMulti() {
        if (phase !== "answer") return;
        const n = settingsState.playerCount;
        let allCorrect = n > 0;
        for (let i = 0; i < n; i++) {
          if (groupSelected[i]) {
            sessionScores[i] += 1;
            stats.groups[i] += 1;
          } else {
            allCorrect = false;
          }
        }
        stats.rounds += 1;
        stats.streak = allCorrect ? stats.streak + 1 : 0;
        bumpMaxDigits();
        saveStats();
        renderSessionScores();
        enterReady(false);
      }

      function goHome() {
        clearTimers();
        setAnswerControls(false);
        phase = "home";
        showScreen(home);
        readyText.classList.add("hidden");
        flashText.classList.add("hidden");
        speakText.classList.add("hidden");
        sessionScoresEl.classList.add("hidden");
        renderHomeHint();
      }

      function startGame() {
        sessionScores = emptyGroups();
        showScreen(game);
        enterReady(false);
      }

      startBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        startGame();
      });

      settingsBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        phase = "settings";
        showScreen(settings);
      });

      settingsBack.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        goHome();
      });

      flashRange.addEventListener("input", () => {
        settingsState.flashMs = clampMs(flashRange.value);
        saveSettings();
      });

      document.getElementById("flashPresets").addEventListener("click", (e) => {
        const btn = e.target.closest("[data-ms]");
        if (!btn) return;
        settingsState.flashMs = clampMs(btn.dataset.ms);
        saveSettings();
      });

      sizeRange.addEventListener("input", () => {
        settingsState.sizePct = clampSize(sizeRange.value);
        saveSettings();
      });

      document.getElementById("sizePresets").addEventListener("click", (e) => {
        const btn = e.target.closest("[data-size]");
        if (!btn) return;
        settingsState.sizePct = clampSize(btn.dataset.size);
        saveSettings();
      });

      digitRange.addEventListener("input", () => {
        settingsState.digits = normalizeDigits(digitRange.value);
        saveSettings();
      });

      mixMinRange.addEventListener("input", () => {
        settingsState.digits = "mix";
        const mix = normalizeMix(mixMinRange.value, settingsState.mixMax);
        settingsState.mixMin = mix.min;
        settingsState.mixMax = mix.max;
        saveSettings();
      });

      mixMaxRange.addEventListener("input", () => {
        settingsState.digits = "mix";
        const mix = normalizeMix(settingsState.mixMin, mixMaxRange.value);
        settingsState.mixMin = mix.min;
        settingsState.mixMax = mix.max;
        saveSettings();
      });

      document.getElementById("digitChips").addEventListener("click", (e) => {
        const btn = e.target.closest("[data-digits]");
        if (!btn) return;
        settingsState.digits = normalizeDigits(btn.dataset.digits);
        if (settingsState.digits === "mix") {
          const mix = normalizeMix(settingsState.mixMin, settingsState.mixMax);
          settingsState.mixMin = mix.min;
          settingsState.mixMax = mix.max;
        }
        saveSettings();
      });

      document.getElementById("playerChips").addEventListener("click", (e) => {
        const btn = e.target.closest("[data-players]");
        if (!btn) return;
        settingsState.playerCount = clampPlayers(btn.dataset.players);
        saveSettings();
      });

      [exitBtn, replayBtn, nextBtn, yesBtn, noBtn, groupRow, answerBar].forEach(bindStop);

      exitBtn.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        goHome();
      });

      replayBtn.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (phase !== "answer") return;
        enterReady(true);
      });

      yesBtn.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        recordSolo(true);
      });

      noBtn.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        recordSolo(false);
      });

      nextBtn.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        commitMulti();
      });

      groupRow.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        const btn = e.target.closest("[data-group]");
        if (!btn) return;
        toggleGroup(Number(btn.dataset.group));
      });

      game.addEventListener("pointerup", (e) => {
        if (e.target.closest("#exitBtn, #answerBar, #yesBtn, #noBtn, #replayBtn, #nextBtn, #groupRow, #sessionScores")) return;
        if (phase === "speak") enterAnswer();
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          if (phase === "home") return;
          e.preventDefault();
          goHome();
          return;
        }
        if (e.repeat) return;
        const tag = (e.target && e.target.tagName) || "";
        if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;

        if (phase === "answer") {
          const multi = settingsState.playerCount >= 2;
          if (multi && e.key >= "1" && e.key <= "7") {
            e.preventDefault();
            toggleGroup(Number(e.key) - 1);
            return;
          }
          if (e.key === "y" || e.key === "Y" || e.key === "Enter") {
            e.preventDefault();
            if (multi) commitMulti();
            else recordSolo(true);
            return;
          }
          if (!multi && (e.key === "n" || e.key === "N")) {
            e.preventDefault();
            recordSolo(false);
            return;
          }
          return;
        }

        if (e.target && e.target.closest && e.target.closest("button")) return;
        if (e.key !== " " && e.key !== "Enter") return;
        e.preventDefault();
        if (phase === "home") {
          startGame();
        } else if (phase === "speak") {
          enterAnswer();
        }
      });

      renderSettings();

      if ("serviceWorker" in navigator) {
        const isSecure =
          location.protocol === "https:" ||
          location.hostname === "localhost" ||
          location.hostname === "127.0.0.1";
        if (isSecure) {
          window.addEventListener("load", () => {
            navigator.serviceWorker.register("./sw.js").catch(() => {});
          });
        }
      }
    })();
  </script>

</body>
</html>
