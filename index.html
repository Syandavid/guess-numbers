<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="猜数字">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="看一眼数字，然后说出来。">
  <title>猜数字</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    :root {
      --bg: #000;
      --text: #fff;
      --orange: #FF7A00;
      --muted: rgba(255, 255, 255, 0.55);
      --app-h: 100dvh;
      --stage-max: 480px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      width: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Helvetica Neue", sans-serif;
      touch-action: manipulation;
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: stretch;
    }

    #app {
      position: relative;
      width: 100%;
      max-width: none;
      height: var(--app-h);
      overflow: hidden;
      background: #000;
      container-type: inline-size;
      container-name: stage;
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
    }

    @media (orientation: landscape) and (max-height: 560px) {
      .title {
        font-size: clamp(32px, 14vh, 56px);
      }
      #home {
        padding-top: calc(env(safe-area-inset-top, 0px) + 8px);
        padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
        padding-left: calc(env(safe-area-inset-left, 0px) + 24px);
        padding-right: calc(env(safe-area-inset-right, 0px) + 24px);
      }
      .stage {
        padding: 0 20px 12px;
        min-height: 0;
        overflow: hidden;
      }
      #game.answering .stage { padding-bottom: 96px; }
      .answer-bar {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
      }
      .judge-row { max-width: none; width: auto; }
      .judge-btn { font-size: 18px; padding: 8px 16px; }
      .group-chip { width: 40px; height: 40px; font-size: 16px; }
      .replay-btn { font-size: 16px; padding: 8px 18px; }
      .phase-text { font-size: clamp(40px, 16vh, 72px); }
      .home-actions {
        flex-direction: row;
        width: min(100%, 520px);
      }
      .start-btn, .ghost-btn { font-size: 20px; padding: 12px 20px; }
    }

    @media (hover: hover) and (pointer: fine) and (min-width: 960px) and (min-height: 700px) {
      html, body {
        background: #161616;
        align-items: center;
      }
      #app {
        max-width: var(--stage-max);
        height: min(var(--app-h), calc(100dvh - 32px));
        max-height: calc(100dvh - 32px);
        border-radius: 24px;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.08),
          0 24px 64px rgba(0, 0, 0, 0.5);
        padding-left: 0;
        padding-right: 0;
      }
    }

    .screen {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
    }
    .screen.active { display: flex; }

    #home {
      padding: calc(env(safe-area-inset-top, 0px) + 24px) 32px calc(env(safe-area-inset-bottom, 0px) + 40px);
      justify-content: space-between;
      align-items: center;
    }

    .home-spacer { flex: 1; }

    .title {
      font-size: clamp(56px, 18vw, 92px);
      font-size: clamp(56px, 18cqi, 92px);
      font-weight: 700;
      letter-spacing: 0.06em;
      line-height: 1.1;
      text-align: center;
    }

    .home-hint {
      margin-top: 16px;
      color: var(--muted);
      font-size: 15px;
      letter-spacing: 0.06em;
      text-align: center;
    }

    .home-best {
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
      letter-spacing: 0.06em;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .best-banner {
      position: absolute;
      top: calc(env(safe-area-inset-top, 0px) + 52px);
      left: 0;
      right: 0;
      z-index: 2;
      color: #22C55E;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-align: center;
      pointer-events: none;
    }

    .home-actions {
      width: min(100%, 320px);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .start-btn, .ghost-btn {
      appearance: none;
      border: none;
      width: 100%;
      padding: 18px 28px;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 0.12em;
      border-radius: 18px;
      cursor: pointer;
      font-family: inherit;
    }
    .start-btn { background: #fff; color: #000; }
    .ghost-btn {
      background: transparent;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.28);
      font-size: 20px;
      padding: 14px 28px;
    }
    .start-btn:active, .ghost-btn:active { transform: scale(0.98); opacity: 0.92; }

    #game { cursor: pointer; }

    .exit-btn {
      position: absolute;
      top: calc(env(safe-area-inset-top, 0px) + 8px);
      left: calc(env(safe-area-inset-left, 0px) + 12px);
      z-index: 2;
      appearance: none;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 16px;
      font-weight: 500;
      padding: 12px 14px;
      font-family: inherit;
      cursor: pointer;
      letter-spacing: 0.04em;
    }
    .exit-btn:active { opacity: 0.7; }

    .stage {
      flex: 1;
      min-height: 0;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px 88px;
      pointer-events: none;
      overflow: hidden;
    }

    .phase-text {
      font-size: clamp(64px, 20vw, 104px);
      font-size: clamp(64px, 20cqi, 104px);
      font-weight: 700;
      letter-spacing: 0.12em;
      line-height: 1;
      text-align: center;
    }
    .phase-text.ready { color: var(--orange); }
    .phase-text.speak { color: #fff; }

    .numbers {
      display: block;
      max-width: 100%;
      max-height: 100%;
      color: #fff;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum";
      font-weight: 700;
      font-size: 48px;
      letter-spacing: 0.02em;
      line-height: 1.05;
      text-align: center;
      white-space: normal;
      word-break: break-all;
      overflow-wrap: anywhere;
      overflow: hidden;
    }
    .numbers.answer { color: #22C55E; }

    .session-scores {
      position: absolute;
      top: calc(env(safe-area-inset-top, 0px) + 14px);
      right: calc(env(safe-area-inset-right, 0px) + 16px);
      z-index: 2;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.18em;
      pointer-events: none;
    }

    #game.answering .stage { padding-bottom: 220px; }
    @media (orientation: landscape) and (max-height: 560px) {
      #game.answering .stage { padding-bottom: 96px; }
    }

    .answer-bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 0 20px;
    }

    .judge-row {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 320px;
    }
    .judge-btn {
      flex: 1;
      appearance: none;
      border: 1px solid rgba(255,255,255,0.28);
      background: rgba(0,0,0,0.5);
      color: #fff;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 0.16em;
      border-radius: 16px;
      padding: 16px 20px;
      font-family: inherit;
      cursor: pointer;
    }
    .judge-btn:active { opacity: 0.85; transform: scale(0.98); }

    .group-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      width: 100%;
      max-width: 280px;
    }
    .group-chip {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      appearance: none;
      border: 2px solid rgba(255,255,255,0.35);
      background: transparent;
      color: #fff;
      font-size: 22px;
      font-weight: 700;
      font-family: inherit;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
    }
    .group-chip.active {
      background: #22C55E;
      border-color: #22C55E;
      color: #000;
    }
    .group-chip:active { transform: scale(0.96); }

    .action-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .replay-btn {
      appearance: none;
      border: 1px solid rgba(255,255,255,0.28);
      background: rgba(0,0,0,0.5);
      color: #fff;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.12em;
      border-radius: 16px;
      padding: 14px 36px;
      font-family: inherit;
      cursor: pointer;
    }
    .replay-btn:active { opacity: 0.85; }

    #settings {
      padding: calc(env(safe-area-inset-top, 0px) + 56px) 24px calc(env(safe-area-inset-bottom, 0px) + 32px);
      gap: 28px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .settings-title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 0 8px;
    }

    .setting {
      padding: 0 8px;
    }
    .setting-label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 12px;
      font-size: 16px;
      color: var(--muted);
      letter-spacing: 0.06em;
    }
    .setting-value {
      color: #fff;
      font-variant-numeric: tabular-nums;
      font-size: 18px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--orange);
      height: 28px;
    }

    .chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .chip {
      appearance: none;
      border: 1px solid rgba(255,255,255,0.22);
      background: transparent;
      color: #fff;
      border-radius: 999px;
      padding: 10px 16px;
      font-size: 16px;
      font-family: inherit;
      cursor: pointer;
      letter-spacing: 0.04em;
    }
    .chip.active {
      background: var(--orange);
      border-color: var(--orange);
      color: #000;
      font-weight: 600;
    }

    .hidden { display: none !important; }

    .exit-btn.right {
      left: auto;
      right: calc(env(safe-area-inset-right, 0px) + 12px);
    }
    .exit-btn.danger { color: #f87171; }

    #records, #recordDetail {
      padding: calc(env(safe-area-inset-top, 0px) + 56px) 24px calc(env(safe-area-inset-bottom, 0px) + 32px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .records-empty {
      color: var(--muted);
      font-size: 15px;
      letter-spacing: 0.06em;
      text-align: center;
      margin-top: 48px;
    }

    .records-list {
      display: flex;
      flex-direction: column;
      margin-top: 4px;
    }

    .record-row {
      appearance: none;
      border: none;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      background: transparent;
      color: #fff;
      width: 100%;
      text-align: left;
      padding: 16px 8px;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.04em;
      font-family: inherit;
      cursor: pointer;
      font-variant-numeric: tabular-nums;
    }
    .record-row:active { opacity: 0.7; }

    .detail-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 8px 8px 28px;
    }
    .detail-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .detail-k {
      color: var(--muted);
      font-size: 14px;
      letter-spacing: 0.08em;
    }
    .detail-v {
      font-size: 18px;
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
      white-space: pre-line;
      line-height: 1.45;
    }

    .danger-ghost {
      color: #f87171;
      border-color: rgba(248, 113, 113, 0.4);
      font-size: 18px;
    }

    .confirm-modal {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.72);
      padding: 24px;
    }
    .confirm-card {
      width: min(100%, 300px);
      background: #111;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 18px;
      padding: 24px 20px 18px;
    }
    .confirm-card p {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-align: center;
      margin-bottom: 20px;
    }
    .confirm-actions {
      display: flex;
      gap: 10px;
    }
    .confirm-actions .ghost-btn,
    .confirm-actions .danger-btn {
      flex: 1;
      width: auto;
      font-size: 18px;
      padding: 12px 16px;
    }
    .danger-btn {
      appearance: none;
      border: none;
      background: #ef4444;
      color: #fff;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.12em;
      border-radius: 16px;
      padding: 12px 16px;
      font-family: inherit;
      cursor: pointer;
    }
    .danger-btn:active { opacity: 0.9; transform: scale(0.98); }

    .start-btn:focus-visible,
    .ghost-btn:focus-visible,
    .exit-btn:focus-visible,
    .replay-btn:focus-visible,
    .judge-btn:focus-visible,
    .group-chip:focus-visible,
    .chip:focus-visible,
    .record-row:focus-visible,
    .danger-btn:focus-visible,
    input[type="range"]:focus-visible {
      outline: 2px solid var(--orange);
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <div id="app">
    <section id="home" class="screen active" aria-label="首页">
      <div class="home-spacer"></div>
      <h1 class="title">猜数字</h1>
      <p class="home-hint" id="homeHint"></p>
      <p class="home-best" id="homeBest"></p>
      <div class="home-spacer"></div>
      <div class="home-actions">
        <button type="button" class="start-btn" id="startBtn">开始</button>
        <button type="button" class="ghost-btn" id="settingsBtn">难度设置</button>
        <button type="button" class="ghost-btn" id="recordsBtn">记录</button>
      </div>
    </section>

    <section id="settings" class="screen" aria-label="难度设置">
      <button type="button" class="exit-btn" id="settingsBack">返回</button>
      <h2 class="settings-title">难度</h2>
      <div class="setting">
        <div class="setting-label">
          <span>闪现时长</span>
          <span class="setting-value" id="flashLabel">0.40 秒</span>
        </div>
        <input type="range" id="flashRange" min="50" max="1000" step="25" value="400">
        <div class="chips" id="flashPresets" style="margin-top:12px">
          <button type="button" class="chip" data-ms="50">极快</button>
          <button type="button" class="chip" data-ms="100">很快</button>
          <button type="button" class="chip" data-ms="200">快</button>
          <button type="button" class="chip" data-ms="400">普通</button>
          <button type="button" class="chip" data-ms="800">慢</button>
        </div>
      </div>
      <div class="setting">
        <div class="setting-label">
          <span>数字位数</span>
          <span class="setting-value" id="digitLabel">5 位</span>
        </div>
        <input type="range" id="digitRange" min="1" max="15" step="1" value="5">
        <div class="chips" id="digitChips" style="margin-top:12px">
          <button type="button" class="chip" data-digits="4">4</button>
          <button type="button" class="chip" data-digits="5">5</button>
          <button type="button" class="chip" data-digits="8">8</button>
          <button type="button" class="chip" data-digits="10">10</button>
          <button type="button" class="chip" data-digits="12">12</button>
          <button type="button" class="chip" data-digits="15">15</button>
          <button type="button" class="chip" data-digits="mix">随机</button>
        </div>
      </div>
      <div class="setting" id="mixSetting">
        <div class="setting-label">
          <span>随机最少</span>
          <span class="setting-value" id="mixMinLabel">4 位</span>
        </div>
        <input type="range" id="mixMinRange" min="1" max="15" step="1" value="4">
        <div class="setting-label" style="margin-top:16px">
          <span>随机最多</span>
          <span class="setting-value" id="mixMaxLabel">10 位</span>
        </div>
        <input type="range" id="mixMaxRange" min="1" max="15" step="1" value="10">
      </div>
      <div class="setting">
        <div class="setting-label">
          <span>人数</span>
          <span class="setting-value" id="playerLabel">单人</span>
        </div>
        <div class="chips" id="playerChips">
          <button type="button" class="chip" data-players="1">单人</button>
          <button type="button" class="chip" data-players="2">2</button>
          <button type="button" class="chip" data-players="3">3</button>
          <button type="button" class="chip" data-players="4">4</button>
          <button type="button" class="chip" data-players="5">5</button>
          <button type="button" class="chip" data-players="6">6</button>
          <button type="button" class="chip" data-players="7">7</button>
        </div>
      </div>
      <div class="setting">
        <div class="setting-label">
          <span>数字大小</span>
          <span class="setting-value" id="sizeLabel">100%</span>
        </div>
        <input type="range" id="sizeRange" min="50" max="100" step="5" value="100">
        <div class="chips" id="sizePresets" style="margin-top:12px">
          <button type="button" class="chip" data-size="60">小</button>
          <button type="button" class="chip" data-size="80">中</button>
          <button type="button" class="chip" data-size="100">最大</button>
        </div>
      </div>
    </section>

    <section id="game" class="screen" aria-label="游戏">
      <button type="button" class="exit-btn" id="exitBtn">退出</button>
      <div id="sessionScores" class="session-scores hidden" aria-hidden="true"></div>
      <div id="bestBanner" class="best-banner hidden" aria-hidden="true">新纪录</div>
      <div class="stage">
        <div id="readyText" class="phase-text ready hidden">准备</div>
        <div id="flashText" class="numbers hidden"></div>
        <div id="speakText" class="phase-text speak hidden">请说</div>
      </div>
      <div id="answerBar" class="answer-bar hidden">
        <div id="soloRow" class="judge-row hidden">
          <button type="button" class="judge-btn" id="yesBtn">对</button>
          <button type="button" class="judge-btn" id="noBtn">错</button>
        </div>
        <div id="groupRow" class="group-row hidden"></div>
        <div class="action-row">
          <button type="button" class="replay-btn" id="replayBtn">重玩</button>
          <button type="button" class="replay-btn" id="nextBtn">下一轮</button>
        </div>
      </div>
    </section>

    <section id="records" class="screen" aria-label="记录">
      <button type="button" class="exit-btn" id="recordsBack">返回</button>
      <button type="button" class="exit-btn right danger hidden" id="clearRecordsBtn">清空</button>
      <h2 class="settings-title">记录</h2>
      <p id="recordsEmpty" class="records-empty">还没有记录</p>
      <div id="recordsList" class="records-list"></div>
    </section>

    <section id="recordDetail" class="screen" aria-label="记录详情">
      <button type="button" class="exit-btn" id="detailBack">返回</button>
      <h2 class="settings-title">记录</h2>
      <div class="detail-list">
        <div class="detail-item">
          <span class="detail-k">时间段</span>
          <span class="detail-v" id="detailTime"></span>
        </div>
        <div class="detail-item">
          <span class="detail-k">难度</span>
          <span class="detail-v" id="detailDiff"></span>
        </div>
        <div class="detail-item">
          <span class="detail-k">对错</span>
          <span class="detail-v" id="detailScore"></span>
        </div>
        <div class="detail-item" id="detailRankBlock">
          <span class="detail-k">排名</span>
          <span class="detail-v" id="detailRank"></span>
        </div>
        <div class="detail-item">
          <span class="detail-k">纪录</span>
          <span class="detail-v" id="detailBest"></span>
        </div>
      </div>
      <button type="button" class="ghost-btn danger-ghost" id="deleteRecordBtn">删除本局</button>
    </section>

    <div id="confirmModal" class="confirm-modal hidden" role="dialog" aria-modal="true" aria-labelledby="confirmText">
      <div class="confirm-card">
        <p id="confirmText"></p>
        <div class="confirm-actions">
          <button type="button" class="ghost-btn" id="confirmCancel">取消</button>
          <button type="button" class="danger-btn" id="confirmOk">删除</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const home = document.getElementById("home");
      const game = document.getElementById("game");
      const settings = document.getElementById("settings");
      const startBtn = document.getElementById("startBtn");
      const settingsBtn = document.getElementById("settingsBtn");
      const settingsBack = document.getElementById("settingsBack");
      const exitBtn = document.getElementById("exitBtn");
      const readyText = document.getElementById("readyText");
      const flashText = document.getElementById("flashText");
      const speakText = document.getElementById("speakText");
      const replayBtn = document.getElementById("replayBtn");
      const nextBtn = document.getElementById("nextBtn");
      const yesBtn = document.getElementById("yesBtn");
      const noBtn = document.getElementById("noBtn");
      const answerBar = document.getElementById("answerBar");
      const soloRow = document.getElementById("soloRow");
      const groupRow = document.getElementById("groupRow");
      const sessionScoresEl = document.getElementById("sessionScores");
      const playerLabel = document.getElementById("playerLabel");
      const app = document.getElementById("app");
      const flashRange = document.getElementById("flashRange");
      const digitRange = document.getElementById("digitRange");
      const digitLabel = document.getElementById("digitLabel");
      const mixSetting = document.getElementById("mixSetting");
      const mixMinRange = document.getElementById("mixMinRange");
      const mixMaxRange = document.getElementById("mixMaxRange");
      const mixMinLabel = document.getElementById("mixMinLabel");
      const mixMaxLabel = document.getElementById("mixMaxLabel");
      const flashLabel = document.getElementById("flashLabel");
      const homeHint = document.getElementById("homeHint");
      const homeBest = document.getElementById("homeBest");
      const bestBanner = document.getElementById("bestBanner");
      const detailBest = document.getElementById("detailBest");
      const sizeRange = document.getElementById("sizeRange");
      const sizeLabel = document.getElementById("sizeLabel");
      const stageEl = document.querySelector("#game .stage");
      const records = document.getElementById("records");
      const recordDetail = document.getElementById("recordDetail");
      const recordsBtn = document.getElementById("recordsBtn");
      const recordsBack = document.getElementById("recordsBack");
      const clearRecordsBtn = document.getElementById("clearRecordsBtn");
      const recordsEmpty = document.getElementById("recordsEmpty");
      const recordsList = document.getElementById("recordsList");
      const detailBack = document.getElementById("detailBack");
      const detailTime = document.getElementById("detailTime");
      const detailDiff = document.getElementById("detailDiff");
      const detailScore = document.getElementById("detailScore");
      const detailRank = document.getElementById("detailRank");
      const detailRankBlock = document.getElementById("detailRankBlock");
      const deleteRecordBtn = document.getElementById("deleteRecordBtn");
      const confirmModal = document.getElementById("confirmModal");
      const confirmText = document.getElementById("confirmText");
      const confirmCancel = document.getElementById("confirmCancel");
      const confirmOk = document.getElementById("confirmOk");

      const STORE = "guess-numbers-settings";
      const SESSIONS_KEY = "guess-numbers-sessions";
      const BEST_KEY = "guess-numbers-best";
      const MAX_SESSIONS = 200;

      let settingsState = loadSettings();
      let sessions = loadSessions();
      let personalBest = loadBest();
      let currentSession = null;
      let viewingId = null;
      let confirmResolve = null;
      let phase = "home";
      let readyTimer = null;
      let flashTimer = null;
      let lastNumber = "";
      let sessionScores = [0, 0, 0, 0, 0, 0, 0];
      let groupSelected = [];

      function loadSettings() {
        try {
          const raw = localStorage.getItem(STORE);
          if (raw) {
            const parsed = JSON.parse(raw);
            const flashMs = clampMs(parsed.flashMs);
            const digits = normalizeDigits(parsed.digits);
            const mix = normalizeMix(parsed.mixMin, parsed.mixMax);
            return {
              flashMs: flashMs,
              digits: digits,
              mixMin: mix.min,
              mixMax: mix.max,
              sizePct: clampSize(parsed.sizePct),
              playerCount: clampPlayers(parsed.playerCount)
            };
          }
        } catch (_) {}
        return { flashMs: 400, digits: 5, mixMin: 4, mixMax: 10, sizePct: 100, playerCount: 1 };
      }

      function clampMs(n) {
        n = Number(n);
        if (!Number.isFinite(n)) return 400;
        return Math.min(1000, Math.max(50, Math.round(n / 25) * 25));
      }

      function clampSize(n) {
        n = Number(n);
        if (!Number.isFinite(n)) return 100;
        return Math.min(100, Math.max(50, Math.round(n / 5) * 5));
      }

      function clampPlayers(n) {
        n = Number(n);
        if (!Number.isFinite(n)) return 1;
        return Math.min(7, Math.max(1, Math.round(n)));
      }

      function clampDigit(n, fallback) {
        n = Number(n);
        if (!Number.isInteger(n)) return fallback;
        return Math.min(15, Math.max(1, n));
      }

      function normalizeDigits(d) {
        if (d === "mix") return "mix";
        return clampDigit(d, 5);
      }

      function normalizeMix(minV, maxV) {
        let min = clampDigit(minV, 4);
        let max = clampDigit(maxV, 10);
        if (min > max) {
          const t = min;
          min = max;
          max = t;
        }
        return { min: min, max: max };
      }

      function saveSettings() {
        try {
          localStorage.setItem(STORE, JSON.stringify(settingsState));
        } catch (_) {}
        renderSettings();
      }

      function emptyGroups() {
        return [0, 0, 0, 0, 0, 0, 0];
      }

      function loadSessions() {
        try {
          const raw = localStorage.getItem(SESSIONS_KEY);
          if (!raw) return [];
          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) return [];
          return parsed.filter((s) => s && typeof s === "object" && s.id);
        } catch (_) {
          return [];
        }
      }

      function saveSessions() {
        try {
          localStorage.setItem(SESSIONS_KEY, JSON.stringify(sessions));
        } catch (_) {}
      }

      function loadBest() {
        try {
          const raw = localStorage.getItem(BEST_KEY);
          if (!raw) return null;
          const parsed = JSON.parse(raw);
          const digits = Number(parsed && parsed.digits);
          const flashMs = Number(parsed && parsed.flashMs);
          if (!Number.isInteger(digits) || digits < 1 || digits > 15) return null;
          if (!Number.isFinite(flashMs) || flashMs < 50 || flashMs > 1000) return null;
          return { digits: digits, flashMs: flashMs };
        } catch (_) {
          return null;
        }
      }

      function saveBest() {
        try {
          if (personalBest) localStorage.setItem(BEST_KEY, JSON.stringify(personalBest));
        } catch (_) {}
      }

      function formatFlashCompact(ms) {
        const n = Number(ms);
        if (!Number.isFinite(n)) return "0 秒";
        const t = (n / 1000).toFixed(3).replace(/0+$/, "").replace(/\.$/, "");
        return t + " 秒";
      }

      function isBetterBest(digits, flashMs, cur) {
        if (!cur) return true;
        if (digits > cur.digits) return true;
        if (digits < cur.digits) return false;
        return flashMs < cur.flashMs;
      }

      function hideBestBanner() {
        bestBanner.classList.add("hidden");
        bestBanner.setAttribute("aria-hidden", "true");
      }

      function showBestBanner() {
        bestBanner.textContent = "新纪录";
        bestBanner.classList.remove("hidden");
        bestBanner.setAttribute("aria-hidden", "false");
      }

      function considerBest() {
        const digits = (lastNumber || "").length;
        if (!digits) return;
        const flashMs = currentSession && currentSession.settings
          ? currentSession.settings.flashMs
          : settingsState.flashMs;
        if (!isBetterBest(digits, flashMs, personalBest)) return;
        personalBest = { digits: digits, flashMs: flashMs };
        saveBest();
        if (currentSession) {
          currentSession.newBest = true;
          currentSession.bestDigits = digits;
          currentSession.bestFlashMs = flashMs;
        }
        showBestBanner();
      }

      function pad2(n) {
        return String(n).padStart(2, "0");
      }

      function formatClock(ms) {
        const d = new Date(ms);
        return pad2(d.getHours()) + ":" + pad2(d.getMinutes());
      }

      function formatMonthDayTime(ms) {
        const d = new Date(ms);
        return (d.getMonth() + 1) + "月" + d.getDate() + "日 " + formatClock(ms);
      }

      function sameCalendarDay(a, b) {
        const da = new Date(a);
        const db = new Date(b);
        return (
          da.getFullYear() === db.getFullYear() &&
          da.getMonth() === db.getMonth() &&
          da.getDate() === db.getDate()
        );
      }

      function formatTimeRange(start, end) {
        if (sameCalendarDay(start, end)) return formatClock(start) + "–" + formatClock(end);
        return formatMonthDayTime(start) + " – " + formatMonthDayTime(end);
      }

      function sessionPlayers(s) {
        const n = Number(s && s.playerCount);
        if (!Number.isFinite(n)) return 1;
        return Math.min(7, Math.max(1, Math.round(n)));
      }

      function sessionWinnerIndex(s) {
        const n = sessionPlayers(s);
        const groups = Array.isArray(s.groups) ? s.groups : [];
        let winner = -1;
        let max = -1;
        let ties = 0;
        for (let i = 0; i < n; i++) {
          const g = Number(groups[i]) || 0;
          if (g > max) {
            max = g;
            winner = i;
            ties = 1;
          } else if (g === max) {
            ties += 1;
          }
        }
        if (max <= 0 || ties !== 1) return -1;
        return winner;
      }

      function sessionRowText(s) {
        const rounds = Math.max(0, Math.floor(Number(s.rounds) || 0));
        const head = formatMonthDayTime(s.startAt) + " · " + rounds + " 轮";
        const n = sessionPlayers(s);
        if (n <= 1) return head + " · 单人";
        const w = sessionWinnerIndex(s);
        const people = n + "人";
        if (w < 0) return head + " · " + people;
        return head + " · " + people + " · 组" + (w + 1) + "胜";
      }

      function sessionDifficulty(s) {
        const set = s.settings || {};
        const flash = ((Number(set.flashMs) || 0) / 1000).toFixed(2) + "秒";
        let digits;
        if (set.digits === "mix") {
          digits = "随机 " + set.mixMin + "–" + set.mixMax + "位";
        } else {
          digits = set.digits + "位";
        }
        const n = sessionPlayers(s);
        const people = n <= 1 ? "单人" : n + "人";
        return flash + " · " + digits + " · " + people;
      }

      function sessionScoreText(s) {
        const n = sessionPlayers(s);
        if (n <= 1) {
          return "对 " + (Number(s.correct) || 0) + " · 错 " + (Number(s.wrong) || 0);
        }
        const groups = Array.isArray(s.groups) ? s.groups : [];
        const parts = [];
        for (let i = 0; i < n; i++) {
          parts.push("组" + (i + 1) + " " + (Number(groups[i]) || 0));
        }
        return parts.join(" · ");
      }

      function sessionRankText(s) {
        const n = sessionPlayers(s);
        if (n <= 1) {
          const rounds = Math.max(0, Math.floor(Number(s.rounds) || 0));
          const correct = Math.max(0, Math.floor(Number(s.correct) || 0));
          if (!rounds) return "正确率 —";
          return "正确率 " + Math.round((correct / rounds) * 100) + "%";
        }
        const items = [];
        const groups = Array.isArray(s.groups) ? s.groups : [];
        for (let i = 0; i < n; i++) {
          items.push({ i: i, score: Number(groups[i]) || 0 });
        }
        items.sort((a, b) => b.score - a.score || a.i - b.i);
        let lastScore = null;
        let lastRank = 0;
        const lines = [];
        for (let k = 0; k < items.length; k++) {
          const rank = lastScore !== null && items[k].score === lastScore ? lastRank : k + 1;
          lastRank = rank;
          lastScore = items[k].score;
          lines.push(rank + ". 组" + (items[k].i + 1) + "  " + items[k].score);
        }
        return lines.join("\n");
      }

      function newSessionId() {
        return String(Date.now()) + Math.random().toString(36).slice(2, 8);
      }

      function beginSession() {
        const n = settingsState.playerCount;
        currentSession = {
          id: newSessionId(),
          startAt: Date.now(),
          endAt: 0,
          playerCount: n,
          settings: {
            flashMs: settingsState.flashMs,
            digits: settingsState.digits,
            mixMin: settingsState.mixMin,
            mixMax: settingsState.mixMax,
            sizePct: settingsState.sizePct
          },
          rounds: 0,
          correct: 0,
          wrong: 0,
          groups: Array.from({ length: n }, () => 0),
          newBest: false
        };
      }

      function finalizeSession() {
        if (!currentSession) return;
        if (currentSession.rounds >= 1) {
          currentSession.endAt = Date.now();
          sessions.unshift(currentSession);
          if (sessions.length > MAX_SESSIONS) sessions.length = MAX_SESSIONS;
          saveSessions();
        }
        currentSession = null;
      }

      function askConfirm(msg) {
        return new Promise((resolve) => {
          if (confirmResolve) confirmResolve(false);
          confirmResolve = resolve;
          confirmText.textContent = msg;
          confirmModal.classList.remove("hidden");
        });
      }

      function closeConfirm(ok) {
        confirmModal.classList.add("hidden");
        const fn = confirmResolve;
        confirmResolve = null;
        if (fn) fn(!!ok);
      }

      function digitsLabel() {
        if (settingsState.digits === "mix") {
          return "随机 " + settingsState.mixMin + "–" + settingsState.mixMax + " 位";
        }
        return settingsState.digits + " 位";
      }

      function playerCountLabel() {
        return settingsState.playerCount === 1 ? "单人" : settingsState.playerCount + " 人";
      }

      function renderHomeBest() {
        if (!personalBest) {
          homeBest.textContent = "打对一题，留下纪录";
          return;
        }
        homeBest.textContent = "目前 " + personalBest.digits + " 位 · " + formatFlashCompact(personalBest.flashMs);
      }

      function renderHomeHint() {
        if (!sessions.length) {
          homeHint.textContent = "共 0 局";
        } else {
          homeHint.textContent = sessionRowText(sessions[0]);
        }
        renderHomeBest();
      }

      function renderRecords() {
        const empty = sessions.length === 0;
        recordsEmpty.classList.toggle("hidden", !empty);
        clearRecordsBtn.classList.toggle("hidden", empty);
        recordsList.innerHTML = "";
        if (empty) return;
        sessions.forEach((s) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "record-row";
          btn.dataset.id = s.id;
          btn.textContent = sessionRowText(s);
          recordsList.appendChild(btn);
        });
      }

      function openRecords() {
        phase = "records";
        renderRecords();
        showScreen(records);
      }

      function openRecordDetail(id) {
        const s = sessions.find((x) => x.id === id);
        if (!s) {
          openRecords();
          return;
        }
        viewingId = id;
        phase = "recordDetail";
        detailTime.textContent = formatTimeRange(s.startAt, s.endAt || s.startAt);
        detailDiff.textContent = sessionDifficulty(s);
        detailScore.textContent = sessionScoreText(s);
        detailRank.textContent = sessionRankText(s);
        if (s.newBest && s.bestDigits) {
          detailBest.textContent = "本局新纪录 · " + s.bestDigits + " 位 · " + formatFlashCompact(s.bestFlashMs);
        } else {
          detailBest.textContent = "本局无新纪录";
        }
        showScreen(recordDetail);
      }

      function renderSettings() {
        flashRange.value = String(settingsState.flashMs);
        flashLabel.textContent = (settingsState.flashMs / 1000).toFixed(2) + " 秒";
        const isMix = settingsState.digits === "mix";
        mixSetting.classList.toggle("hidden", !isMix);
        digitRange.classList.toggle("hidden", isMix);
        if (!isMix) digitRange.value = String(settingsState.digits);
        mixMinRange.value = String(settingsState.mixMin);
        mixMaxRange.value = String(settingsState.mixMax);
        mixMinLabel.textContent = settingsState.mixMin + " 位";
        mixMaxLabel.textContent = settingsState.mixMax + " 位";
        digitLabel.textContent = digitsLabel();
        sizeRange.value = String(settingsState.sizePct);
        sizeLabel.textContent = settingsState.sizePct + "%";
        playerLabel.textContent = playerCountLabel();
        renderHomeHint();
        document.querySelectorAll("#sizePresets .chip").forEach((btn) => {
          btn.classList.toggle("active", Number(btn.dataset.size) === settingsState.sizePct);
        });
        document.querySelectorAll("#flashPresets .chip").forEach((btn) => {
          btn.classList.toggle("active", Number(btn.dataset.ms) === settingsState.flashMs);
        });
        document.querySelectorAll("#digitChips .chip").forEach((btn) => {
          const val = btn.dataset.digits === "mix" ? "mix" : Number(btn.dataset.digits);
          btn.classList.toggle("active", val === settingsState.digits);
        });
        document.querySelectorAll("#playerChips .chip").forEach((btn) => {
          btn.classList.toggle("active", Number(btn.dataset.players) === settingsState.playerCount);
        });
      }

      function showScreen(el) {
        home.classList.remove("active");
        game.classList.remove("active");
        settings.classList.remove("active");
        records.classList.remove("active");
        recordDetail.classList.remove("active");
        el.classList.add("active");
        if (el === home) {
          renderHomeHint();
        }
      }

      function setAppHeight() {
        const vv = window.visualViewport;
        const h = vv ? vv.height : window.innerHeight;
        const w = vv ? vv.width : window.innerWidth;
        document.documentElement.style.setProperty("--app-h", h + "px");
        if (vv) {
          app.style.transform = "translate(" + vv.offsetLeft + "px," + vv.offsetTop + "px)";
          app.style.width = w + "px";
        } else {
          app.style.width = "";
          app.style.transform = "";
        }
      }

      function relayoutGame() {
        setAppHeight();
        if (phase === "flash" || phase === "answer" || phase === "ready" || phase === "speak") {
          requestAnimationFrame(applyNumberSize);
        }
      }

      setAppHeight();
      window.addEventListener("resize", relayoutGame);
      window.addEventListener("orientationchange", () => {
        relayoutGame();
        setTimeout(relayoutGame, 250);
        setTimeout(relayoutGame, 600);
      });
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", relayoutGame);
        window.visualViewport.addEventListener("scroll", setAppHeight);
      }

      document.addEventListener("gesturestart", (e) => e.preventDefault());
      document.addEventListener("dblclick", (e) => e.preventDefault());
      document.addEventListener(
        "touchmove",
        (e) => {
          if (e.touches.length > 1) e.preventDefault();
        },
        { passive: false }
      );

      function clearTimers() {
        if (readyTimer !== null) {
          clearTimeout(readyTimer);
          readyTimer = null;
        }
        if (flashTimer !== null) {
          clearTimeout(flashTimer);
          flashTimer = null;
        }
      }

      function vibrate() {
        try {
          if (navigator.vibrate) navigator.vibrate(12);
        } catch (_) {}
      }

      function showOnly(el) {
        readyText.classList.add("hidden");
        flashText.classList.add("hidden");
        speakText.classList.add("hidden");
        el.classList.remove("hidden");
      }

      function randomNumber() {
        let digits = settingsState.digits;
        if (digits === "mix") {
          const span = settingsState.mixMax - settingsState.mixMin + 1;
          digits = settingsState.mixMin + Math.floor(Math.random() * span);
        }
        if (digits <= 1) return String(Math.floor(Math.random() * 10));
        let s = String(1 + Math.floor(Math.random() * 9));
        for (let i = 1; i < digits; i++) s += String(Math.floor(Math.random() * 10));
        return s;
      }

      function stopBubble(e) {
        e.stopPropagation();
      }

      function bindStop(el) {
        el.addEventListener("pointerdown", stopBubble);
        el.addEventListener("pointerup", stopBubble);
        el.addEventListener("click", stopBubble);
      }

      function renderSessionScores() {
        const n = settingsState.playerCount;
        if (n < 2 || (phase !== "ready" && phase !== "flash" && phase !== "speak" && phase !== "answer")) {
          sessionScoresEl.classList.add("hidden");
          return;
        }
        sessionScoresEl.textContent = sessionScores.slice(0, n).join("  ");
        sessionScoresEl.classList.remove("hidden");
      }

      function setAnswerControls(on) {
        game.classList.toggle("answering", on);
        answerBar.classList.toggle("hidden", !on);
        if (!on) {
          soloRow.classList.add("hidden");
          groupRow.classList.add("hidden");
          nextBtn.classList.add("hidden");
          return;
        }
        const multi = settingsState.playerCount >= 2;
        soloRow.classList.toggle("hidden", multi);
        groupRow.classList.toggle("hidden", !multi);
        nextBtn.classList.toggle("hidden", !multi);
        if (multi) rebuildGroups();
      }

      function rebuildGroups() {
        const n = settingsState.playerCount;
        groupSelected = [];
        groupRow.innerHTML = "";
        for (let i = 0; i < n; i++) {
          groupSelected.push(false);
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "group-chip";
          btn.textContent = String(i + 1);
          btn.dataset.group = String(i);
          btn.setAttribute("aria-label", "组 " + (i + 1));
          btn.setAttribute("aria-pressed", "false");
          groupRow.appendChild(btn);
        }
      }

      function toggleGroup(i) {
        if (phase !== "answer") return;
        if (i < 0 || i >= settingsState.playerCount) return;
        groupSelected[i] = !groupSelected[i];
        const btn = groupRow.querySelector('[data-group="' + i + '"]');
        if (btn) {
          btn.classList.toggle("active", groupSelected[i]);
          btn.setAttribute("aria-pressed", groupSelected[i] ? "true" : "false");
        }
      }

      function stageInnerBox() {
        if (!stageEl) {
          return { width: Math.max(40, window.innerWidth - 32), height: Math.max(40, window.innerHeight * 0.5) };
        }
        const cs = getComputedStyle(stageEl);
        const width = stageEl.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
        const height = stageEl.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
        return { width: Math.max(40, width), height: Math.max(40, height) };
      }

      function applyNumberSize() {
        const text = lastNumber || flashText.textContent || "0";
        const n = Math.max(1, text.length);
        const box = stageInnerBox();
        const width = box.width;
        const height = box.height;
        const glyph = 0.72;
        const ls = 0.02;
        const lh = 1.05;
        let lo = 12;
        let hi = Math.min(width, height, 240);
        let best = 12;
        while (hi - lo > 0.5) {
          const fs = (lo + hi) / 2;
          const colW = fs * (glyph + ls);
          const cols = Math.max(1, Math.floor(width / colW));
          const rows = Math.ceil(n / cols);
          if (rows * fs * lh <= height && n * colW / rows <= width) {
            best = fs;
            lo = fs;
          } else {
            hi = fs;
          }
        }
        best *= settingsState.sizePct / 100;
        flashText.style.maxWidth = width + "px";
        flashText.style.maxHeight = height + "px";
        flashText.style.fontSize = best + "px";
        flashText.style.letterSpacing = best * ls + "px";
        if (flashText.offsetParent) {
          for (let i = 0; i < 24; i++) {
            if (flashText.scrollWidth <= width + 1 && flashText.scrollHeight <= height + 1) break;
            best *= 0.9;
            if (best < 12) break;
            flashText.style.fontSize = best + "px";
            flashText.style.letterSpacing = best * ls + "px";
          }
        }
      }

      function enterReady(keep) {
        clearTimers();
        setAnswerControls(false);
        phase = "ready";
        showOnly(readyText);
        renderSessionScores();
        vibrate();
        readyTimer = setTimeout(() => {
          readyTimer = null;
          enterFlash(keep);
        }, 1500);
      }

      function enterFlash(keep) {
        phase = "flash";
        hideBestBanner();
        setAnswerControls(false);
        if (!keep) lastNumber = randomNumber();
        flashText.classList.remove("answer");
        flashText.textContent = lastNumber;
        showOnly(flashText);
        applyNumberSize();
        renderSessionScores();
        vibrate();
        flashTimer = setTimeout(() => {
          flashTimer = null;
          enterSpeak();
        }, settingsState.flashMs);
      }

      function enterSpeak() {
        phase = "speak";
        setAnswerControls(false);
        showOnly(speakText);
        renderSessionScores();
        vibrate();
      }

      function enterAnswer() {
        phase = "answer";
        flashText.classList.add("answer");
        flashText.textContent = lastNumber;
        showOnly(flashText);
        setAnswerControls(true);
        requestAnimationFrame(applyNumberSize);
        renderSessionScores();
        vibrate();
      }

      function recordSolo(ok) {
        if (phase !== "answer") return;
        if (currentSession) {
          currentSession.rounds += 1;
          if (ok) currentSession.correct += 1;
          else currentSession.wrong += 1;
        }
        const playerCount = currentSession ? currentSession.playerCount : settingsState.playerCount;
        if (ok && playerCount === 1) considerBest();
        enterReady(false);
      }

      function commitMulti() {
        if (phase !== "answer") return;
        const n = currentSession ? currentSession.playerCount : settingsState.playerCount;
        for (let i = 0; i < n; i++) {
          if (groupSelected[i]) {
            sessionScores[i] += 1;
            if (currentSession) currentSession.groups[i] += 1;
          }
        }
        if (currentSession) currentSession.rounds += 1;
        renderSessionScores();
        enterReady(false);
      }

      function goHome() {
        clearTimers();
        setAnswerControls(false);
        hideBestBanner();
        phase = "home";
        showScreen(home);
        readyText.classList.add("hidden");
        flashText.classList.add("hidden");
        speakText.classList.add("hidden");
        sessionScoresEl.classList.add("hidden");
        renderHomeHint();
      }

      function leaveGame() {
        finalizeSession();
        goHome();
      }

      function startGame() {
        sessionScores = emptyGroups();
        hideBestBanner();
        beginSession();
        showScreen(game);
        enterReady(false);
      }

      startBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        startGame();
      });

      settingsBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        phase = "settings";
        showScreen(settings);
      });

      recordsBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        openRecords();
      });

      recordsBack.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        goHome();
      });

      recordsList.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-id]");
        if (!btn) return;
        openRecordDetail(btn.dataset.id);
      });

      detailBack.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        viewingId = null;
        openRecords();
      });

      clearRecordsBtn.addEventListener("click", async (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (!sessions.length) return;
        const ok = await askConfirm("删除全部记录？");
        if (!ok) return;
        sessions = [];
        saveSessions();
        renderRecords();
        renderHomeHint();
      });

      deleteRecordBtn.addEventListener("click", async (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (!viewingId) return;
        const ok = await askConfirm("删除这条记录？");
        if (!ok) return;
        sessions = sessions.filter((s) => s.id !== viewingId);
        saveSessions();
        viewingId = null;
        renderHomeHint();
        openRecords();
      });

      confirmCancel.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        closeConfirm(false);
      });

      confirmOk.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        closeConfirm(true);
      });

      confirmModal.addEventListener("click", (e) => {
        if (e.target === confirmModal) closeConfirm(false);
      });

      settingsBack.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        goHome();
      });

      flashRange.addEventListener("input", () => {
        settingsState.flashMs = clampMs(flashRange.value);
        saveSettings();
      });

      document.getElementById("flashPresets").addEventListener("click", (e) => {
        const btn = e.target.closest("[data-ms]");
        if (!btn) return;
        settingsState.flashMs = clampMs(btn.dataset.ms);
        saveSettings();
      });

      sizeRange.addEventListener("input", () => {
        settingsState.sizePct = clampSize(sizeRange.value);
        saveSettings();
      });

      document.getElementById("sizePresets").addEventListener("click", (e) => {
        const btn = e.target.closest("[data-size]");
        if (!btn) return;
        settingsState.sizePct = clampSize(btn.dataset.size);
        saveSettings();
      });

      digitRange.addEventListener("input", () => {
        settingsState.digits = normalizeDigits(digitRange.value);
        saveSettings();
      });

      mixMinRange.addEventListener("input", () => {
        settingsState.digits = "mix";
        const mix = normalizeMix(mixMinRange.value, settingsState.mixMax);
        settingsState.mixMin = mix.min;
        settingsState.mixMax = mix.max;
        saveSettings();
      });

      mixMaxRange.addEventListener("input", () => {
        settingsState.digits = "mix";
        const mix = normalizeMix(settingsState.mixMin, mixMaxRange.value);
        settingsState.mixMin = mix.min;
        settingsState.mixMax = mix.max;
        saveSettings();
      });

      document.getElementById("digitChips").addEventListener("click", (e) => {
        const btn = e.target.closest("[data-digits]");
        if (!btn) return;
        settingsState.digits = normalizeDigits(btn.dataset.digits);
        if (settingsState.digits === "mix") {
          const mix = normalizeMix(settingsState.mixMin, settingsState.mixMax);
          settingsState.mixMin = mix.min;
          settingsState.mixMax = mix.max;
        }
        saveSettings();
      });

      document.getElementById("playerChips").addEventListener("click", (e) => {
        const btn = e.target.closest("[data-players]");
        if (!btn) return;
        settingsState.playerCount = clampPlayers(btn.dataset.players);
        saveSettings();
      });

      [exitBtn, replayBtn, nextBtn, yesBtn, noBtn, groupRow, answerBar].forEach(bindStop);

      exitBtn.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        leaveGame();
      });

      replayBtn.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (phase !== "answer") return;
        enterReady(true);
      });

      yesBtn.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        recordSolo(true);
      });

      noBtn.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        recordSolo(false);
      });

      nextBtn.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        commitMulti();
      });

      groupRow.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        const btn = e.target.closest("[data-group]");
        if (!btn) return;
        toggleGroup(Number(btn.dataset.group));
      });

      game.addEventListener("pointerup", (e) => {
        if (e.target.closest("#exitBtn, #answerBar, #yesBtn, #noBtn, #replayBtn, #nextBtn, #groupRow, #sessionScores")) return;
        if (phase === "speak") enterAnswer();
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          e.preventDefault();
          if (!confirmModal.classList.contains("hidden")) {
            closeConfirm(false);
            return;
          }
          if (phase === "home") return;
          if (phase === "ready" || phase === "flash" || phase === "speak" || phase === "answer") {
            leaveGame();
          } else if (phase === "recordDetail") {
            viewingId = null;
            openRecords();
          } else {
            goHome();
          }
          return;
        }
        if (e.repeat) return;
        const tag = (e.target && e.target.tagName) || "";
        if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;

        if (phase === "answer") {
          const multi = settingsState.playerCount >= 2;
          if (multi && e.key >= "1" && e.key <= "7") {
            e.preventDefault();
            toggleGroup(Number(e.key) - 1);
            return;
          }
          if (e.key === "y" || e.key === "Y" || e.key === "Enter") {
            e.preventDefault();
            if (multi) commitMulti();
            else recordSolo(true);
            return;
          }
          if (!multi && (e.key === "n" || e.key === "N")) {
            e.preventDefault();
            recordSolo(false);
            return;
          }
          return;
        }

        if (e.target && e.target.closest && e.target.closest("button")) return;
        if (e.key !== " " && e.key !== "Enter") return;
        e.preventDefault();
        if (phase === "home") {
          startGame();
        } else if (phase === "speak") {
          enterAnswer();
        }
      });

      renderSettings();

      if ("serviceWorker" in navigator) {
        const isSecure =
          location.protocol === "https:" ||
          location.hostname === "localhost" ||
          location.hostname === "127.0.0.1";
        if (isSecure) {
          window.addEventListener("load", () => {
            navigator.serviceWorker.register("./sw.js").catch(() => {});
          });
        }
      }
    })();
  </script>

</body>
</html>
